<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Civic Dirigir">
<meta name="theme-color" content="#05070a">
<title>Civic Dirigir</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<style>
/* Painel de direção — iPhone 17 Pro Max (440×956 pt), retrato e paisagem. Fundo preto (OLED, não ofusca à noite). */
:root {
  --bg: #05070a; --tile: #0f141b; --line: #1d2633; --fg: #f2f5f9; --muted: #7d8899;
  --rpm: #ff6b3d; --speed: #2ec8ff; --temp: #ffb020; --volt: #8b7bff; --o2: #2ee59d; --pedal: #ff4fa3;
  --ok: #2ee59d; --warn: #ffb020; --bad: #ff4d5e;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
  --disp: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--disp); overflow: hidden; -webkit-user-select: none; user-select: none }
.app { height: 100%; display: grid; grid-template-rows: auto auto auto auto 1fr auto; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(14px, env(safe-area-inset-left, 0px)) }
.app > .top { grid-row: 1 } .app > .rpmbar { grid-row: 2 } .app > .alert { grid-row: 3 } .app > .core { grid-row: 4 } .app > .tiles, .app > .graphs { grid-row: 5 } .app > .foot { grid-row: 6 }
.app.off .core, .app.off .tiles, .app.off .graphs, .app.off .rpmbar { opacity: .38 }
.top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); gap: 8px }
.top a { color: var(--muted); text-decoration: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px }
.st { display: inline-flex; align-items: center; gap: 6px } .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)) }

/* barra de rotação com luz de troca */
.rpmbar { position: relative; height: 18px; border-radius: 9px; background: var(--tile); overflow: hidden; border: 1px solid var(--line) }
.rpmbar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--o2), var(--speed) 45%, var(--temp) 70%, var(--bad)); transition: width .25s linear }
.rpmbar .ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 4px; font: 600 9px var(--mono); color: #000a; align-items: center; pointer-events: none }
.rpmbar.shift { animation: shift .35s steps(2) infinite } @keyframes shift { 50% { border-color: var(--bad); box-shadow: 0 0 18px var(--bad) } }

/* núcleo: velocidade + marcha + rpm */
.core { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; min-height: 0 }
.spd { display: grid; justify-items: start }
.spd b { font: 800 clamp(120px, 38vw, 220px)/0.86 var(--disp); letter-spacing: -0.04em; font-variant-numeric: tabular-nums }
.spd span { font: 600 18px var(--disp); color: var(--muted); margin-top: 4px }
.side { display: grid; gap: 10px; justify-items: end }
.gear { width: 96px; height: 96px; border-radius: 24px; border: 2px solid var(--line); display: grid; place-items: center; font: 800 58px var(--disp); background: var(--tile) }
.gear small { display: block; font: 600 10px var(--disp); color: var(--muted); letter-spacing: .1em; margin-top: -14px }
.rpmnum { text-align: right } .rpmnum b { font: 700 34px var(--mono); color: var(--rpm); font-variant-numeric: tabular-nums } .rpmnum span { display: block; font-size: 12px; color: var(--muted) }
.hint { font: 700 13px var(--disp); color: var(--ok); text-align: right; min-height: 16px }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-content: start; min-height: 0 }
.t { background: var(--tile); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; min-width: 0; border-top: 3px solid var(--c, var(--line)) }
.t .l { font: 600 10px var(--disp); text-transform: uppercase; letter-spacing: .03em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.t .v { font: 700 24px var(--mono); font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap } .t .v small { font: 600 11px var(--disp); color: var(--muted); margin-left: 2px }
.t .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.t.wide { grid-column: span 2 }
.t.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--tile)) } .t.bad .v { color: var(--bad) }
.t.warn { border-color: var(--warn) } .t.warn .v { color: var(--warn) }
.lam { position: relative; height: 8px; border-radius: 4px; margin-top: 6px; background: linear-gradient(90deg, var(--temp), var(--o2) 45% 55%, var(--speed)) }
.lam i { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--fg); transform: translateX(-2px); transition: left .4s }

.alert { display: none; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--s, var(--bad)) 18%, var(--tile)); border: 1px solid var(--s, var(--bad)); font: 700 15px var(--disp) }
.alert.on { display: block } .alert span { display: block; font: 500 12px var(--disp); color: var(--muted); margin-top: 2px }
.foot { display: flex; justify-content: space-between; font: 600 11px var(--mono); color: var(--muted) }

/* paisagem (no suporte do carro) */
@media (orientation: landscape) {
  .app { grid-template-columns: 1.05fr 1fr; grid-template-rows: auto auto auto 1fr auto; column-gap: 16px }
  .top, .rpmbar, .alert { grid-column: 1 / -1 } .app > .core { grid-row: 4 } .app > .tiles { grid-row: 4; grid-template-columns: repeat(3, minmax(0, 1fr)) } .app > .foot { grid-row: 5 }
  .spd b { font-size: clamp(110px, 26vh, 200px) } .foot { grid-column: 1 / -1 }
  .t .v { font-size: 20px }
}
.acc { position: fixed; inset: 0; z-index: 10; background: color-mix(in srgb, #000 88%, transparent); display: grid; place-items: center; padding: 20px }
.acc[hidden] { display: none } .accin { display: grid; gap: 14px; justify-items: center; text-align: center; width: 100% }
.acst { font: 700 22px var(--disp); color: var(--warn) } .acst.go { color: var(--ok) } .acst.run { color: var(--speed) }
.actime { font: 800 clamp(90px, 30vw, 160px)/1 var(--mono); font-variant-numeric: tabular-nums }
.acspl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(420px, 100%) }
.acspl div { background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 10px } .acspl b { display: block; font: 700 22px var(--mono) } .acspl span { font-size: 11px; color: var(--muted) }
.acbtns { display: flex; gap: 10px } .acbtns button { font: 700 16px var(--disp); padding: 14px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--tile); color: var(--fg) }
.cfg { max-height: 86vh; overflow: auto } .cfg ul { list-style: none; margin: 0; padding: 0; width: min(420px, 100%); display: grid; gap: 6px; text-align: left }
.cfg li { display: flex; justify-content: space-between; align-items: center; background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 15px }
.cfg li input { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px } .cfg li button { font-size: 14px; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 4px 9px; margin-left: 4px }
.t.good .v { color: var(--ok) }
.lam.trim { background: linear-gradient(90deg, var(--bad), var(--warn) 30%, var(--o2) 40% 60%, var(--warn) 70%, var(--bad)) }
.graphs { display: grid; grid-template-columns: 1fr; gap: 8px; align-content: start; min-height: 0; overflow: auto }
.graphs[hidden] { display: none } .g { background: var(--tile); border: 1px solid var(--line); border-radius: 16px; padding: 8px 10px 6px }
.g .h { display: flex; justify-content: space-between; font: 600 11px var(--disp); color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.g .h b { font: 700 15px var(--mono); color: var(--fg); text-transform: none; letter-spacing: 0 } .g canvas { width: 100%; height: 74px; display: block }
.g.bad { border-color: var(--bad) } .g.bad .h b { color: var(--bad) }
.app.graphmode .core { grid-template-columns: 1fr auto } .app.graphmode .spd b { font-size: clamp(70px, 22vw, 120px) } .app.graphmode .gear { width: 70px; height: 70px; font-size: 40px }
@media (orientation: landscape) { .app > .graphs { grid-row: 4; grid-template-columns: 1fr 1fr } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="st"><span class="dot" id="dot"></span><span id="state">Conectando…</span></span><span id="clock" class="num"></span><span style="display:flex;gap:6px"><a href="#" id="grBtn" aria-label="Modo gráfico">📈</a><a href="#" id="cfgBtn" aria-label="Configurar quadros">⚙</a><a href="#" id="accBtn">⏱ 0–100</a><a href="/">Painel</a></span></div>
  <div class="rpmbar" id="rpmbar"><i id="rpmfill"></i><div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div></div>
  <div class="alert" id="alert"></div>
  <div class="core">
    <div class="spd"><b id="spd">0</b><span>km/h</span></div>
    <div class="side">
      <div class="gear"><div><span id="gear">–</span><small>MARCHA</small></div></div>
      <div class="rpmnum"><b id="rpm">0</b><span>rpm</span></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="graphs" id="graphs" hidden></div>
  <div class="acc" id="acc" hidden><div class="accin">
    <div class="acst" id="acst">Pare o carro</div>
    <div class="actime" id="actime">0,00</div>
    <div class="acspl" id="acspl"></div>
    <div class="acbtns"><button type="button" id="acRe">Novo teste</button><button type="button" id="acX">Fechar</button></div>
  </div></div>
  <div class="acc" id="cfg" hidden><div class="accin cfg">
    <div class="acst go">Quadros do modo direção</div>
    <ul id="cfgList"></ul>
    <div class="acbtns"><button type="button" id="cfgSave">Salvar</button><button type="button" id="cfgReset">Padrão</button></div>
  </div></div>
  <div class="foot"><span id="ftrip"></span><span id="fage"></span></div>
</div>
<script>
(() => {
  const $ = (s) => document.getElementById(s);
  const nf = (v, d = 0) => v == null || Number.isNaN(+v) ? "—" : Number(v).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const dur = (s) => s == null ? "—" : s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}` : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  // ---- catálogo de quadros (o usuário escolhe quais e a ordem; salvo neste aparelho)
  let fuelInfo = null;
  const loadFuel = () => fetch("/api/fuel").then((r) => r.json()).then((j) => { fuelInfo = j; }).catch(() => { });
  loadFuel(); setInterval(loadFuel, 60000);
  const sgn = (x, d = 1) => x == null ? "—" : (x > 0 ? "+" : "") + nf(x, d);
  const CAT = {
    kml: { l: "Consumo", c: "--o2", r: (v) => v.kml_inst != null ? [nf(v.kml_inst, 1), "km/L", v.fuel_lh != null ? nf(v.fuel_lh, 2) + " L/h" : ""] : [nf(v.fuel_lh, 1), "L/h", "parado"] },
    kmlavg: { l: "Média viagem", c: "--o2", r: (v, t) => [nf(t.kml, 1), "km/L", t.fuel_l ? nf(t.fuel_l, 2) + " L" + (t.cost ? " · R$ " + nf(t.cost, 2) : "") : "calculando…"] },
    kmltank: { l: "Média do tanque", c: "--o2", r: (v, t) => { const sf = fuelInfo?.since_fill; if (!sf) return ["—", "km/L", ""];
      const km = (sf.km || 0) + (t.km || 0), l = (sf.liters_est || 0) + (t.fuel_l || 0);     // viagens fechadas desde o tanque + a viagem de agora
      return [l > 0.3 ? nf(km / l, 1) : "—", "km/L", `${nf(km, 0)} km · ${nf(l, 1)} L desde o tanque`]; } },
    prev: { l: "Previsão da viagem", c: "--o2", wide: true, r: (v, t) => {
      const el = t.elapsed_s || 0, lh = el > 60 ? t.fuel_l / (el / 3600) : v.fuel_lh;   // média de L/h desde que ligou
      const kml = t.kml ?? fuelInfo?.avg_real_kml ?? fuelInfo?.since_fill?.kml_est;
      const price = fuelInfo?.fills?.find((f) => f.price_l)?.price_l;
      return [nf(kml, 1), "km/L", `${nf(lh, 2)} L/h desde que ligou${price && lh ? " · ≈ R$ " + nf(lh * price, 2) + "/h" : ""} · ${nf((t.fuel_l || 0), 2)} L até agora`]; } },
    auto: { l: "Autonomia", c: "--o2", r: (v, t) => { const f = fuelInfo; if (!f?.fills?.length) return ["—", "", "registre um tanque cheio"];
      const rest = Math.max(0, f.tank_l - (f.since_fill?.liters_est || 0) - (t.fuel_l || 0)); const kml = f.avg_real_kml ?? t.kml ?? f.since_fill?.kml_est;
      return [kml ? nf(rest * kml, 0) : "—", "km", `≈ ${nf(rest, 0)} L no tanque`]; } },
    avg: { l: "Vel. média", c: "--speed", r: (v, t) => [nf(t.avg_moving ?? t.avg_speed), "km/h", t.max_speed ? "máx " + nf(t.max_speed) : ""] },
    stft: { l: "Ajuste curto combustível", c: "--o2", k: "stft1", wide: true, bar: true, r: (v) => [sgn(v.stft1), "%", v.stft1 == null ? "" : v.stft1 > 10 ? "ECU adicionando combustível (pobre)" : v.stft1 < -10 ? "ECU tirando combustível (rica)" : "normal ±10%"] },
    lam: { l: "Oxigênio (λ)", c: "--o2", k: "o2c1_lambda", r: (v) => [nf(v.o2c1_lambda, 2), "", v.o2c1_lambda == null ? "" : v.o2c1_lambda < 0.97 ? "rica" : v.o2c1_lambda > 1.9 ? "corte" : v.o2c1_lambda > 1.03 ? "pobre" : "ideal"] },
    timing: { l: "Avanço", c: "--volt", k: "timing", r: (v) => [nf(v.timing, 1), "°", ""] },
    ect: { l: "Motor", c: "--temp", k: "ect", r: (v) => [nf(v.ect), "°C", v.iat != null ? "ar " + nf(v.iat) + " °C" : ""] },
    batt: { l: "Bateria", c: "--volt", k: "batt", r: (v) => [nf(v.batt, 1), "V", ""] },
    load: { l: "Carga", c: "--rpm", k: "load", r: (v) => [nf(v.load), "%", v.map != null ? "MAP " + nf(v.map) + " kPa" : ""] },
    km: { l: "Km viagem", c: "--speed", r: (v, t) => [nf(t.km, 1), "km", ""] },
    time: { l: "Tempo ligado", c: "--speed", r: (v, t) => [dur(t.elapsed_s), "", t.moving_s ? "rodando " + dur(t.moving_s) : ""] },
    tps: { l: "Borboleta", c: "--pedal", k: "tps", r: (v) => [nf(v.tps, 1), "%", v.tps_cmd != null ? "cmd " + nf(v.tps_cmd, 1) + "%" : ""] },
    iat: { l: "Ar admitido", c: "--temp", k: "iat", r: (v) => [nf(v.iat), "°C", ""] },
    map: { l: "MAP", c: "--speed", k: "map", r: (v) => [nf(v.map), "kPa", ""] },
    maf: { l: "Fluxo de ar", c: "--speed", k: "maf", r: (v) => [nf(v.maf, 1), "g/s", ""] },
  };
  const DEFAULT = ["kml", "kmlavg", "kmltank", "stft", "timing", "ect", "prev", "auto", "km", "time", "avg", "tps"];
  let chosen; try { chosen = JSON.parse(localStorage.getItem("driveTiles")) || DEFAULT; } catch { chosen = DEFAULT; }
  try { if (!localStorage.getItem("tilesV2")) { localStorage.setItem("tilesV2", "1");            // quadro novo entra uma vez para quem já tinha personalizado
    if (!chosen.includes("kmltank")) { chosen.splice(chosen.indexOf("kmlavg") + 1, 0, "kmltank"); localStorage.setItem("driveTiles", JSON.stringify(chosen)); } } } catch { }
  chosen = chosen.filter((k) => CAT[k]);
  function buildTiles() {
    $("tiles").innerHTML = chosen.map((id) => { const t = CAT[id]; return `<div class="t${t.wide ? " wide" : ""}" id="t-${id}" style="--c:var(${t.c})"><div class="l">${t.l}</div><div class="v" id="v-${id}">—</div><div class="s" id="s-${id}"></div>${t.bar ? `<div class="lam trim"><i id="bar-${id}"></i></div>` : ""}</div>`; }).join("");
  }
  buildTiles();
  function renderTiles(d) {
    const v = d.values || {}, tr = d.trip || {};
    for (const id of chosen) {
      const t = CAT[id]; const el = $("t-" + id); if (!el) continue;
      const [val, unit, sub] = t.r(v, tr);
      $("v-" + id).innerHTML = `${val}<small>${unit}</small>`; $("s-" + id).textContent = sub || "";
      const st = t.k ? d.status?.[t.k]?.[0] : null;
      el.classList.toggle("bad", st === "warn" || st === "crit");           // fora do normal = vermelho
      el.classList.toggle("good", st === "ok");
      if (t.bar && v.stft1 != null) $("bar-" + id).style.left = Math.max(0, Math.min(100, (v.stft1 + 25) / 50 * 100)) + "%";
    }
  }
  // ---- configurar quadros
  $("cfgBtn").addEventListener("click", (e) => { e.preventDefault(); openCfg(); });
  function openCfg() {
    const all = [...chosen, ...Object.keys(CAT).filter((k) => !chosen.includes(k))];
    $("cfgList").innerHTML = all.map((k) => `<li data-k="${k}"><label><input type="checkbox" ${chosen.includes(k) ? "checked" : ""}> ${CAT[k].l}</label><span><button type="button" data-m="-1" aria-label="Subir">▲</button><button type="button" data-m="1" aria-label="Descer">▼</button></span></li>`).join("");
    $("cfg").hidden = false;
  }
  $("cfgList").addEventListener("click", (e) => { const b = e.target.closest("button[data-m]"); if (!b) return; const li = b.closest("li");
    const sib = +b.dataset.m < 0 ? li.previousElementSibling : li.nextElementSibling; if (sib) (+b.dataset.m < 0 ? sib.before(li) : sib.after(li)); });
  $("cfgSave").addEventListener("click", () => { chosen = [...$("cfgList").querySelectorAll("li")].filter((li) => li.querySelector("input").checked).map((li) => li.dataset.k);
    try { localStorage.setItem("driveTiles", JSON.stringify(chosen)); } catch { } buildTiles(); if (lastD) renderTiles(lastD); $("cfg").hidden = true; });
  $("cfgReset").addEventListener("click", () => { chosen = DEFAULT.slice(); try { localStorage.removeItem("driveTiles"); } catch { } buildTiles(); $("cfg").hidden = true; });
  let lastD = null;

  // ---- modo gráfico: séries em tempo real enquanto dirige
  const GR = [
    { id: "spd", l: "Velocidade", u: "km/h", lines: [["speed", "--speed"]] },
    { id: "rpm", l: "Rotação", u: "rpm", lines: [["rpm", "--rpm"]], k: "rpm" },
    { id: "thr", l: "Pedal × borboleta", u: "%", lines: [["pedal_d", "--pedal"], ["tps", "--o2"], ["tps_cmd", "--speed"]], min: 0 },
    { id: "fuel", l: "Consumo", u: "L/h", lines: [["fuel_lh", "--o2"]], min: 0 },
    { id: "maf", l: "Fluxo de ar (MAF)", u: "g/s", lines: [["maf", "--speed"]], min: 0 },
    { id: "lam", l: "Sonda λ (real × alvo)", u: "λ", lines: [["o2c1_lambda", "--o2"], ["lambda_cmd", "--muted"]], k: "o2c1_lambda" },
    { id: "tim", l: "Avanço", u: "°", lines: [["timing", "--volt"]], k: "timing" },
    { id: "load", l: "Carga / MAP", u: "%", lines: [["load", "--rpm"], ["map", "--speed"]], min: 0 },
    { id: "ect", l: "Temp. motor", u: "°C", lines: [["ect", "--temp"]], k: "ect" },
    { id: "stft", l: "Ajuste curto", u: "%", lines: [["stft1", "--o2"]], k: "stft1" },
  ];
  let grSpan = 120e3;
  const H = {};                                   // key -> [[t, v]]
  const css = getComputedStyle(document.documentElement);
  const col = (v) => css.getPropertyValue(v).trim() || "#888";
  function buildGraphs() {
    $("graphs").innerHTML = `<div class="g" style="padding:6px 10px;display:flex;gap:6px;justify-content:flex-end">${[[60e3, "1 min"], [120e3, "2 min"], [300e3, "5 min"]].map(([v, l]) => `<button type="button" class="rb" data-s="${v}" style="font:600 12px var(--disp);background:${v === grSpan ? "var(--line)" : "none"};color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 10px">${l}</button>`).join("")}</div>`
      + GR.map((g) => `<div class="g" id="g-${g.id}"><div class="h"><span>${g.l}</span><b id="gv-${g.id}">—</b></div><canvas id="gc-${g.id}"></canvas></div>`).join("");
  }
  buildGraphs();
  $("graphs").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b) { grSpan = +b.dataset.s; buildGraphs(); drawGraphs(); } });
  let graphMode = false; try { graphMode = localStorage.getItem("driveGraph") === "1"; } catch { }
  const applyMode = () => { $("graphs").hidden = !graphMode; $("tiles").hidden = graphMode; document.querySelector(".app").classList.toggle("graphmode", graphMode); $("grBtn").textContent = graphMode ? "▦" : "📈"; };
  applyMode();
  $("grBtn").addEventListener("click", (e) => { e.preventDefault(); graphMode = !graphMode; try { localStorage.setItem("driveGraph", graphMode ? "1" : "0"); } catch { } applyMode(); drawGraphs(); });
  function pushHist(d) {
    const v = d.values || {}; const t = d.ts;
    for (const g of GR) for (const [k] of g.lines) { if (v[k] == null) continue; const h = (H[k] ??= []); const tk = d.value_ts?.[k] || t; if (!h.length || h.at(-1)[0] !== tk) h.push([tk, v[k]]); while (h.length && h[0][0] < t - 300e3) h.shift(); }
  }
  function drawGraphs() {
    if (!graphMode || !lastD) return;
    const now = lastD.ts, x0 = now - grSpan;
    for (const g of GR) {
      const c = $("gc-" + g.id); if (!c) continue;
      const W = c.clientWidth * devicePixelRatio, Hh = c.clientHeight * devicePixelRatio; if (c.width !== W) { c.width = W; c.height = Hh; }
      const ctx = c.getContext("2d"); ctx.clearRect(0, 0, W, Hh);
      const all = g.lines.flatMap(([k]) => (H[k] || []).filter((p) => p[0] >= x0).map((p) => p[1]));
      if (!all.length) continue;
      let lo = g.min ?? Math.min(...all), hi = Math.max(...all); if (hi - lo < 1e-6) { hi += 1; lo -= g.min != null ? 0 : 1; }
      const pad = (hi - lo) * 0.1; lo = g.min != null ? lo : lo - pad; hi += pad;
      ctx.strokeStyle = col("--line"); ctx.lineWidth = 1; ctx.beginPath(); for (let i = 1; i < 4; i++) { const y = Hh * i / 4; ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
      ctx.fillStyle = col("--muted"); ctx.font = `${10 * devicePixelRatio}px ui-monospace, monospace`; ctx.fillText(nf(hi, hi < 10 ? 1 : 0), 4, 11 * devicePixelRatio); ctx.fillText(nf(lo, hi < 10 ? 1 : 0), 4, Hh - 3);
      g.lines.forEach(([k, cv], i) => { const h = (H[k] || []).filter((p) => p[0] >= x0); if (!h.length) return;
        ctx.strokeStyle = col(cv); ctx.lineWidth = (i === 0 ? 2.4 : 1.6) * devicePixelRatio; ctx.beginPath();
        h.forEach((p, j) => { const x = (p[0] - x0) / grSpan * W, y = Hh - (p[1] - lo) / (hi - lo) * Hh; j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); });
      const v0 = lastD.values?.[g.lines[0][0]];
      $("gv-" + g.id).textContent = v0 == null ? "—" : `${nf(v0, Math.abs(v0) < 10 ? 2 : 0)} ${g.u}`;
      const st = g.k ? lastD.status?.[g.k]?.[0] : null; $("g-" + g.id).classList.toggle("bad", st === "warn" || st === "crit");
    }
  }

  // ---- teste 0–100
  const acc = $("acc");
  const post = (c) => fetch("/api/accel/" + c, { method: "POST" });
  $("accBtn").addEventListener("click", (e) => { e.preventDefault(); acc.hidden = false; post("arm"); });
  $("acRe").addEventListener("click", () => post("arm"));
  $("acX").addEventListener("click", () => { post("cancel"); acc.hidden = true; });
  function renderAcc(d) {
    const a = d.accel; if (!a) return;
    if (acc.hidden && ["pronto", "correndo"].includes(a.state)) acc.hidden = false;
    const st = $("acst"); const map = { aguardando_parar: ["Pare o carro para começar", ""], pronto: ["PRONTO — pode acelerar!", "go"], correndo: ["Medindo…", "run"],
      concluido: ["Concluído!", "go"], incompleto: ["Teste interrompido (não chegou a 100)", ""], cancelado: ["Cancelado", ""] };
    const [t, c] = map[a.state] || [a.state, ""]; st.textContent = t; st.className = "acst " + c;
    const time = a.state === "concluido" ? a.splits["100"] : a.elapsed;
    $("actime").textContent = time != null ? nf(time, 2) : "0,00";
    $("acspl").innerHTML = ["60", "80", "100"].map((k) => `<div><b>${a.splits?.[k] != null ? nf(a.splits[k], 2) + "s" : "—"}</b><span>0–${k} km/h</span></div>`).join("");
    if (a.hz && a.state === "concluido") $("acspl").insertAdjacentHTML("beforeend", `<div style="grid-column:1/-1;font-size:12px;color:var(--muted)">${nf(a.hz, 1)} leituras/s · precisão ≈ ±${nf(1 / a.hz / 2, 2)} s · rpm máx ${nf(a.max_rpm)}</div>`);
  }

  let last = 0;
  function render(d) {
    renderAcc(d);
    const v = d.values || {}, tr = d.trip || {};
    last = Date.now();
    const on = d.engine_on, coll = d.state === "coletando";
    document.querySelector(".app").classList.toggle("off", !on && !coll);   // carro desligado: os números na tela são os últimos lidos
    $("dot").style.setProperty("--c", on ? "var(--ok)" : coll ? "var(--warn)" : "var(--bad)");
    $("state").textContent = on ? "Carro ligado" : coll ? "Ignição ligada" : d.state === "pi_offline" ? "Carro desligado (Pi offline" + (d.pi_last_seen ? " desde " + new Date(d.pi_last_seen).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "") + ")" : d.state === "ecu_silenciosa" ? "Ignição desligada" : "OBD desconectado";
    $("spd").textContent = nf(v.speed);
    const rpm = v.rpm || 0;
    $("rpm").textContent = nf(rpm);
    $("rpm").style.color = ["warn", "crit"].includes(d.status?.rpm?.[0]) ? "var(--bad)" : "";
    $("rpmfill").style.width = Math.min(100, rpm / 7000 * 100) + "%";
    $("rpmbar").classList.toggle("shift", rpm > 6200);
    $("gear").textContent = v.gear == null ? "–" : v.gear === 0 ? "N" : v.gear;
    // dica de economia (manual 5 marchas)
    let hint = "";
    if (v.gear && v.gear < 5 && rpm > 2800 && (v.load ?? 100) < 55) hint = "↑ Suba a marcha";
    else if (v.gear && v.gear > 1 && rpm < 1300 && (v.load ?? 0) > 80) hint = "↓ Reduza a marcha";
    $("hint").textContent = hint;
    lastD = d; pushHist(d); if (graphMode) drawGraphs(); else renderTiles(d);
    // alerta recente (10 min)
    const a = (on || coll) ? (d.alerts || []).find((x) => Date.now() - (x.ts_end || x.ts) < 10 * 60e3 && x.sev !== "info") : null;
    const al = $("alert"); al.classList.toggle("on", !!a);
    if (a) { al.style.setProperty("--s", a.sev === "crit" ? "var(--bad)" : "var(--warn)"); al.innerHTML = `⚠ ${a.title}<span>${a.detail}</span>`; }
    $("ftrip").textContent = d.dtc?.confirmed?.length ? "DTC: " + d.dtc.confirmed.join(" ") : d.mil ? "Luz de injeção acesa" : "Sem códigos de falha";
  }
  setInterval(() => {
    $("clock").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    const age = (Date.now() - last) / 1000;
    $("fage").textContent = lastD?.state === "pi_offline" ? "carro desligado" : last ? (age > 15 ? `sem dados há ${Math.round(age)} s` : "ao vivo") : "";
  }, 1000);

  // painel online: canal ao vivo por WebSocket (cada leitura chega em frações de segundo); o SSE fica de reserva
  let wsTs = 0;
  function liveSocket(onFrame) {
    let ws; const open = () => { try {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/ws");
      ws.onmessage = (e) => { try { const d = JSON.parse(e.data); d.cloud = true; d.age_s = 0; wsTs = d.ts || 0; onFrame(d); } catch { } };
      ws.onclose = () => setTimeout(open, 2000); ws.onerror = () => { try { ws.close(); } catch { } };
    } catch { setTimeout(open, 5000); } };
    open();
  }
  const staleSSE = (d) => d.state !== "pi_offline" && wsTs && (d.ts || 0) <= wsTs;   // o WebSocket já mostrou algo mais novo
  let es;
  const connect = () => { try { es?.close(); } catch { } es = new EventSource("/api/stream"); es.onmessage = (e) => { try { const d = JSON.parse(e.data); if (!staleSSE(d)) { if (d.state === "pi_offline") wsTs = 0; render(d); } } catch (x) { console.error(x); } }; };
  fetch("/api/env").then((r) => r.ok ? r.json() : null).then((env) => { if (env?.cloud) { $("accBtn").hidden = true; liveSocket(render); } }).catch(() => { });
  connect();
  if (location.hash === "#acc") { acc.hidden = false; post("arm"); }
  document.addEventListener("visibilitychange", () => { if (document.hidden) es?.close(); else { connect(); lock(); } });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => { });
  // manter a tela acesa (quando o navegador permitir)
  let wl = null;
  async function lock() { try { if ("wakeLock" in navigator && !wl) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); } } catch { } }
  lock(); document.addEventListener("click", lock, { once: true });
})();
</script>
</body>
</html>
