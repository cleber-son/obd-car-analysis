# /etc/obd/obd.toml — veja src/obdpi/config.py para todos os padrões
[adapter]
transport = "rfcomm"     # rfcomm (Bluetooth) | tcp (emulador)
mac = ""                 # vazio = procura automaticamente um dispositivo com nome de OBD
rfcomm_channel = 1
protocol = "auto"

[collector]
full_period_s = 5        # todos os sensores a cada 5 s
fast_period_s = 0.5      # sensores principais o mais rápido possível (~2 Hz)

[notify]
min_severity = "warn"    # info | warn | crit

[gps]
enabled = true           # sem receptor nada muda: o painel mostra "GPS não conectado"
source = "auto"          # auto (gpsd; serial direta se o gpsd não existir) | gpsd | nmea | replay | off
rate_hz = 5              # taxa pedida ao receptor; grava 1 Hz andando e 1 a cada 30 s parado
# replay_file = "/tmp/commute.nmea"   # com source = "replay" (obdctl gps sim --out …)
moved_m = 300            # "o carro mudou de lugar desligado" a partir desta distância (descontado o que o OBD explica)
summary_names = true     # nomes dos lugares no resumo da viagem no celular ("Casa → Trabalho"); false = só números

# Modo sempre ligado (docs/GPS-ARQUITETURA.md, 9.7): só com alimentação permanente do Pi (relé temporizado ou sensor de
# ignição) e internet no carro. Liga a vigia do estacionamento (alerta se o carro se mover desligado; posição à nuvem a
# cada 5 s) e desliga o Pi com a bateria abaixo de min_batt_v por 10 min. Rode deploy/install.sh depois de mudar
# (cria a regra de sudo do desligamento só com always_on = true).
# [power]
# always_on = false
# min_batt_v = 12.0

[vehicle]
tyre = "205/55 R16"
occupants = 2            # pessoas que costumam andar no carro (entra na massa do dinamômetro, F6)
