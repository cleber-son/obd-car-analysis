# /etc/obd/obd.toml — veja src/obdpi/config.py para todos os padrões
[adapter]
transport = "rfcomm"     # rfcomm (Bluetooth) | tcp (emulador)
mac = ""                 # vazio = procura automaticamente um dispositivo com nome de OBD
rfcomm_channel = 1
protocol = "auto"

[collector]
full_period_s = 5        # todos os sensores a cada 5 s
fast_period_s = 0.5      # sensores principais o mais rápido possível (~2 Hz)

[notify]
min_severity = "warn"    # info | warn | crit
